  <script>
    // mawzun.site/app — one link to hand out for every phone. Android goes to
    // Google Play; an iPhone or iPad goes to the App Store once APP_STORE is
    // set, and meanwhile sees "coming soon"; a computer sees both stores.
    // (.htaccess already sends Android to Google Play before this page loads;
    // this covers hosts without it and in-app browsers.)
    var PLAY = "https://play.google.com/store/apps/details?id=app.mowzoon";
    var APP_STORE = ""; // e.g. "https://apps.apple.com/app/id0000000000" — fill in when the iPhone app is live

    var ua = navigator.userAgent || "";
    var isAndroid = /android/i.test(ua);
    // iPadOS reports itself as a Mac; a touch screen gives it away.
    var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

    if (isAndroid) {
      window.location.replace(PLAY);
    } else if (isIOS && APP_STORE) {
      window.location.replace(APP_STORE);
    }
    document.documentElement.className = "js" + (isIOS ? " is-ios" : "") + (isAndroid ? " is-android" : "");
  </script>
